<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>泰語歌詞同步播放器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3ede2; --ink:#2a2420; --muted:#7a6f63; --paper:#fffdf8; --line:#e2d8c6;
  --accent:#b5452b; --accent-soft:#f6e3d9; --gold:#c89b3c;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1d1916; --ink:#f1e9dc; --muted:#a99b8a; --paper:#fffdf8; --line:#3a322b;
    --accent:#e0714f; --accent-soft:#3b2a22; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Noto Sans Thai",system-ui,sans-serif;}
.app{display:grid;grid-template-columns:minmax(320px,440px) 1fr;height:100%;}
@media (max-width:860px){ .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;} }

/* left: player + controls */
.side{padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;border-right:1px solid var(--line)}
@media (max-width:860px){ .side{border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:10px;max-height:52vh} }
h1{font-size:1.25rem;font-weight:900;margin:0;letter-spacing:.02em}
h1 small{display:block;font-size:.78rem;font-weight:400;color:var(--muted);margin-top:2px}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.video > *{position:absolute;inset:0;width:100%;height:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,.filebtn{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--paper);color:#2a2420;
  border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover,.filebtn:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.rec{background:#c62828;color:#fff;border-color:#c62828}
input[type=text]{font:inherit;font-size:.88rem;flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--paper);color:#2a2420}
.card{background:color-mix(in srgb,var(--paper) 6%,transparent);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h2{font-size:.82rem;margin:0 0 8px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.hint{font-size:.8rem;color:var(--muted);line-height:1.6;margin:6px 0 0}
kbd{font-family:inherit;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper);color:#2a2420}
.status{font-size:.82rem;color:var(--accent);min-height:1.2em}

/* right: lyrics stage */
.stage{overflow-y:auto;scroll-behavior:smooth;padding:30vh 24px 45vh;position:relative}
.empty{max-width:520px;margin:0 auto;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px;padding:40px 24px}
.empty b{color:var(--ink)}
.drag .empty{border-color:var(--accent);background:var(--accent-soft)}
.sec{max-width:760px;margin:28px auto 6px;font-size:.78rem;color:var(--muted);letter-spacing:.08em;font-weight:700}
.ln{max-width:760px;margin:8px auto;padding:12px 16px;border-radius:14px;background:var(--paper);color:#202020;
  opacity:.38;transform:scale(.97);transform-origin:left center;transition:opacity .25s,transform .25s,box-shadow .25s;cursor:pointer;
  border-left:4px solid transparent;line-height:1.6;position:relative}
.ln:hover{opacity:.7}
.ln.active{opacity:1;transform:scale(1);box-shadow:0 8px 28px rgba(80,40,10,.18);border-left-color:var(--accent)}
.ln.past{opacity:.55}
.ln.untimed::after{content:"未對時";position:absolute;right:10px;top:8px;font-size:.68rem;color:#b07a1f;background:#fbf0d9;border-radius:6px;padding:1px 6px}
.ln .thai{font-family:"Noto Sans Thai",sans-serif;font-size:1.35rem;font-weight:700}
.ln .roman{font-size:1.02rem;font-weight:600}
.ln .chinese{font-size:1rem;font-weight:600}
.ln .plain{font-size:1.1rem;font-weight:700}
.ln .chunk{display:inline-block;margin-right:.3em;border-bottom:2px solid currentColor;line-height:1.5}
.hide-thai .thai,.hide-roman .roman,.hide-chinese .chinese{display:none}
.tm{display:none;margin-top:6px;font-size:.78rem;color:#7a6f63;gap:6px;align-items:center}
.editing .tm{display:flex}
.tm button{padding:2px 9px;font-size:.75rem}
.tm code{font-family:ui-monospace,monospace;color:#2a2420;min-width:4.5em}
.recording .ln.next{outline:2px dashed #c62828;outline-offset:3px;opacity:.9}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>泰語歌詞同步播放器<small>載入你的彩色歌詞檔 → 對一次時間 → 之後播放就會跟著跑</small></h1>

    <div class="video"><div id="player"></div></div>

    <div class="row">
      <input type="text" id="vid" value="https://www.youtube.com/watch?v=Zpu7kzkEvGE" aria-label="YouTube 連結">
      <button id="loadVid">換影片</button>
    </div>

    <div class="card">
      <h2>歌詞</h2>
      <div class="row">
        <label class="filebtn">📄 載入歌詞 HTML<input type="file" id="file" accept=".html,.htm" hidden></label>
        <button id="tg-thai" class="on">泰文</button>
        <button id="tg-roman" class="on">拼音</button>
        <button id="tg-chinese" class="on">中文</button>
      </div>
    </div>

    <div class="card">
      <h2>練習</h2>
      <div class="row">
        <select id="rate" aria-label="播放速度">
          <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
          <option value="1" selected>1× 速度</option>
        </select>
        <button id="loop">🔁 單句循環</button>
        <button id="follow" class="on">自動捲動</button>
      </div>
    </div>

    <div class="card">
      <h2>對時間</h2>
      <div class="row">
        <button id="recBtn">⏺ 開始錄製</button>
        <button id="editBtn">✏️ 微調</button>
      </div>
      <p class="hint">按「開始錄製」後歌曲從頭播放，每一句<b>開始唱的瞬間</b>按 <kbd>空白鍵</kbd>（或 <kbd>↓</kbd>）。按錯可按 <kbd>↑</kbd> 退回一句。時間會自動存在這台瀏覽器裡。</p>
      <div class="row" style="margin-top:8px">
        <span style="font-size:.82rem;color:var(--muted)">整體提前/延後</span>
        <button data-off="-0.2">−0.2s</button><button data-off="0.2">+0.2s</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="exp">⬇ 匯出時間檔</button>
        <label class="filebtn">⬆ 匯入時間檔<input type="file" id="imp" accept=".json" hidden></label>
        <button id="clr">清除時間</button>
      </div>
    </div>
    <div class="status" id="status"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="empty" id="empty">
      <p style="font-size:2rem;margin:0">🎵</p>
      <p><b>把你的歌詞 HTML 檔拖到這裡</b><br>或按左邊「載入歌詞 HTML」</p>
      <p class="hint">支援 .pair（泰文＋拼音＋中文）與 .plain 單行格式，顏色組塊會保留。</p>
    </div>
    <div id="lyrics"></div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = {
    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  let player = null, ready = false;
  let videoId = store.get('tlp:video') || 'Zpu7kzkEvGE';
  let lines = [];          // [{html, sec}]
  let times = [];          // seconds or null
  let active = -1, recording = false, recIdx = 0, looping = false;
  const stage = $('#stage'), lyricsEl = $('#lyrics');
  const status = msg => { $('#status').textContent = msg; clearTimeout(status.t); status.t = setTimeout(()=>$('#status').textContent='',3500); };
  const tKey = () => 'tlp:times:' + videoId;

  /* ---------- YouTube ---------- */
  const parseId = s => { const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(s.trim()) ? s.trim() : null); };
  $('#vid').value = 'https://www.youtube.com/watch?v=' + videoId;
  const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('player', {
      videoId, playerVars:{ rel:0, playsinline:1, origin: location.origin !== 'null' ? location.origin : undefined },
      events:{
        onReady(){ ready = true; },
        onError(e){ status('影片載入失敗（代碼 ' + e.data + '）。若用電腦直接開檔案，請看說明改用網址開啟。'); }
      }
    });
  };
  $('#loadVid').onclick = () => {
    const id = parseId($('#vid').value);
    if(!id){ status('看不懂這個連結'); return; }
    videoId = id; store.set('tlp:video', id);
    if(ready) player.loadVideoById(id);
    times = store.get(tKey()) || new Array(lines.length).fill(null); fixTimes(); render();
  };
  const now = () => (ready && player.getCurrentTime) ? player.getCurrentTime() : 0;
  $('#rate').onchange = e => ready && player.setPlaybackRate(+e.target.value);

  /* ---------- lyrics loading ---------- */
  function clean(node){
    node.querySelectorAll('script,style,iframe,object,link').forEach(n=>n.remove());
    node.querySelectorAll('*').forEach(el => [...el.attributes].forEach(a => {
      if(/^on/i.test(a.name) || (a.name!=='class' && a.name!=='style')) el.removeAttribute(a.name);
    }));
    return node.innerHTML;
  }
  function parseLyrics(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const out = []; let sec = '';
    doc.querySelectorAll('h3, h4, .pair, .plain').forEach(el => {
      if(/^H[34]$/.test(el.tagName)){ sec = el.textContent.trim(); return; }
      if(el.classList.contains('plain') && el.closest('.pair')) return;
      const wrap = el.classList.contains('plain') ? (()=>{ const d = document.createElement('div'); d.className='plain'; d.innerHTML = clean(el.cloneNode(true)); return d.outerHTML; })() : clean(el.cloneNode(true));
      out.push({ html: wrap, sec }); sec = '';
    });
    if(!out.length){ // fallback: any non-empty paragraph/line
      doc.body.innerText.split('\n').map(s=>s.trim()).filter(Boolean)
        .forEach(t => { const d=document.createElement('div'); d.className='plain'; d.textContent=t; out.push({html:d.outerHTML, sec:''}); });
    }
    return out;
  }
  function loadLyricsText(html, name){
    lines = parseLyrics(html);
    store.set('tlp:lyrics', lines);
    times = store.get(tKey()) || new Array(lines.length).fill(null); fixTimes();
    render(); status('已載入 ' + lines.length + ' 句' + (name ? '（' + name + '）' : ''));
  }
  function fixTimes(){ if(times.length !== lines.length){ times = lines.map((_,i)=> times[i] ?? null); } }
  const readFile = f => f && f.text().then(t => loadLyricsText(t, f.name));
  $('#file').onchange = e => readFile(e.target.files[0]);
  ['dragenter','dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.remove('drag'); }));
  stage.addEventListener('drop', e => readFile(e.dataTransfer.files[0]));

  /* ---------- render ---------- */
  const fmt = t => t==null ? '--:--.-' : Math.floor(t/60) + ':' + (t%60).toFixed(1).padStart(4,'0');
  function render(){
    $('#empty').style.display = lines.length ? 'none' : '';
    lyricsEl.innerHTML = '';
    lines.forEach((l,i) => {
      if(l.sec){ const s = document.createElement('div'); s.className='sec'; s.textContent = l.sec; lyricsEl.appendChild(s); }
      const d = document.createElement('div');
      d.className = 'ln' + (times[i]==null ? ' untimed' : ''); d.dataset.i = i;
      d.innerHTML = l.html + `<div class="tm"><code>${fmt(times[i])}</code>
        <button data-n="-0.1">−0.1</button><button data-n="0.1">+0.1</button>
        <button data-set="1">設為現在</button></div>`;
      lyricsEl.appendChild(d);
    });
    active = -1; markNext();
  }
  lyricsEl.addEventListener('click', e => {
    const ln = e.target.closest('.ln'); if(!ln) return; const i = +ln.dataset.i;
    const b = e.target.closest('button');
    if(b){
      e.stopPropagation();
      if(b.dataset.set) times[i] = +now().toFixed(2);
      else if(times[i]!=null) times[i] = Math.max(0, +(times[i] + +b.dataset.n).toFixed(2));
      save(); ln.querySelector('code').textContent = fmt(times[i]); ln.classList.toggle('untimed', times[i]==null);
      if(times[i]!=null && ready) player.seekTo(times[i], true);
      return;
    }
    if(recording){ recIdx = i; markNext(); return; }
    if(times[i]!=null && ready){ player.seekTo(times[i], true); player.playVideo(); }
    else status('這句還沒對時間');
  });
  const save = () => store.set(tKey(), times);

  /* ---------- sync loop ---------- */
  function lineAt(t){
    let idx = -1;
    for(let i=0;i<times.length;i++){ if(times[i]!=null && times[i] <= t + 0.05) idx = i; }
    return idx;
  }
  function nextTimed(i){ for(let j=i+1;j<times.length;j++) if(times[j]!=null) return times[j]; return null; }
  function setActive(i){
    if(i === active) return;
    const els = lyricsEl.querySelectorAll('.ln');
    els.forEach((el,k) => { el.classList.toggle('active', k===i); el.classList.toggle('past', i>=0 && k<i); });
    active = i;
    if(i>=0 && $('#follow').classList.contains('on')) els[i].scrollIntoView({block:'center', behavior:'smooth'});
  }
  setInterval(() => {
    if(!ready || !lines.length) return;
    const t = now();
    if(looping && active>=0 && times[active]!=null){
      const end = nextTimed(active);
      if(end!=null && t >= end - 0.05){ player.seekTo(times[active], true); return; }
    }
    if(!looping || active<0) setActive(lineAt(t));
  }, 80);

  /* ---------- recording ---------- */
  function markNext(){
    lyricsEl.querySelectorAll('.ln').forEach((el,k)=>el.classList.toggle('next', recording && k===recIdx));
    const n = lyricsEl.querySelector('.ln.next'); if(n) n.scrollIntoView({block:'center',behavior:'smooth'});
  }
  $('#recBtn').onclick = () => {
    if(!lines.length){ status('請先載入歌詞'); return; }
    recording = !recording;
    document.body.classList.toggle('recording', recording);
    $('#recBtn').classList.toggle('rec', recording);
    $('#recBtn').textContent = recording ? '⏹ 停止錄製' : '⏺ 開始錄製';
    if(recording){
      looping = false; $('#loop').classList.remove('on');
      recIdx = times.findIndex(t => t==null); if(recIdx<0) recIdx = 0;
      if(recIdx === 0 && ready){ player.seekTo(0,true); }
      if(ready) player.playVideo();
      status('每句開頭按空白鍵；點任一句可從那句開始錄');
    } else status('已儲存時間');
    markNext();
  };
  document.addEventListener('keydown', e => {
    if(e.target.matches('input,select')) return;
    if(recording && (e.code==='Space' || e.code==='ArrowDown')){
      e.preventDefault();
      if(recIdx < lines.length){ times[recIdx] = +now().toFixed(2); save();
        const el = lyricsEl.querySelectorAll('.ln')[recIdx];
        el.classList.remove('untimed'); el.querySelector('code').textContent = fmt(times[recIdx]);
        recIdx++; markNext();
        if(recIdx >= lines.length){ $('#recBtn').click(); status('全部對完了！🎉'); }
      }
    } else if(recording && e.code==='ArrowUp'){
      e.preventDefault(); recIdx = Math.max(0, recIdx-1); markNext();
      if(times[recIdx]!=null && ready) player.seekTo(Math.max(0,times[recIdx]-1.5), true);
    } else if(!recording && e.code==='Space' && ready){
      e.preventDefault(); player.getPlayerState()===1 ? player.pauseVideo() : player.playVideo();
    }
  });

  /* ---------- buttons ---------- */
  $('#editBtn').onclick = () => { document.body.classList.toggle('editing'); $('#editBtn').classList.toggle('on'); };
  $('#loop').onclick = () => {
    looping = !looping; $('#loop').classList.toggle('on', looping);
    status(looping ? '會一直重複目前這句（點別句可換句）' : '已關閉單句循環');
  };
  $('#follow').onclick = e => e.currentTarget.classList.toggle('on');
  ['thai','roman','chinese'].forEach(k => $('#tg-'+k).onclick = e => {
    e.currentTarget.classList.toggle('on'); document.body.classList.toggle('hide-'+k);
  });
  document.querySelectorAll('[data-off]').forEach(b => b.onclick = () => {
    const d = +b.dataset.off; times = times.map(t => t==null ? null : Math.max(0, +(t+d).toFixed(2))); save(); render();
    status('全部時間 ' + (d>0?'延後 ':'提前 ') + Math.abs(d) + ' 秒');
  });
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify({videoId, times}, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lyrics_timing_' + videoId + '.json'; a.click();
  };
  $('#imp').onchange = e => e.target.files[0] && e.target.files[0].text().then(t => {
    try{ const o = JSON.parse(t); times = o.times || o; fixTimes(); save(); render(); status('已匯入時間'); }
    catch(err){ status('時間檔格式不對'); }
  });
  $('#clr').onclick = () => { if(confirm('確定清除這首歌所有時間？')){ times = lines.map(()=>null); save(); render(); } };

  /* ---------- restore ---------- */
  const saved = store.get('tlp:lyrics');
  if(saved && saved.length){ lines = saved; times = store.get(tKey()) || lines.map(()=>null); fixTimes(); render(); }
})();
</script>
</body>
</html>
