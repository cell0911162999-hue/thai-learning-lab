<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thai Learning Lab v1.1</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#263443;background:#fafbfc}body{margin:0;padding:22px 14px}.app{max-width:640px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h1{font-size:22px;margin:0}small{color:#687587}.tag{background:#e8edf2;padding:7px 11px;border-radius:30px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:17px 8px;border-radius:16px;text-align:center;background:white;border:1px solid #edf0f3}.stat strong{display:block;font-size:24px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 14px;background:#e9edf2;color:#273747}button.active{background:#304a68;color:white}.panel{padding:24px 18px;border-radius:22px;min-height:260px}.blue{background:#eaf4ff}.purple{background:#f1ebff}.green{background:#e9f7ef}.center{text-align:center}.thai{font-size:39px;margin:22px 0 5px}.roman{font-size:19px;color:#435b72}.meaning{font-size:24px;font-weight:700;margin:17px 0}.muted{color:#5f7080}.primary{background:#325f8b;color:white}.purplebutton{background:#7552a7;color:white}.greenbutton{background:#2d8058;color:white}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.wide{width:100%;margin-top:12px}.hidden{display:none}.option{display:block;width:100%;text-align:left;background:white;border:1px solid #d7c8ee;margin:9px 0}.option.correct{border:2px solid #288259}.option.wrong{border:2px solid #b64747}.wordrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #cce7d7}#notice{font-size:13px;min-height:20px;color:#536575;margin-top:8px}footer{margin-top:22px;font-size:12px;color:#6c7884;line-height:1.6}</style></head><body><main class="app"><header><div><h1>Thai Learning Lab</h1><small>我的泰語學習室</small></div><span class="tag">v1.1</span></header><section class="stats"><div class="stat"><strong id="total">6</strong><small>總單字</small></div><div class="stat"><strong id="knownCount">0</strong><small>已熟悉</small></div><div class="stat"><strong id="answeredCount">0</strong><small>已答題</small></div></section><nav class="tabs"><button id="tabLearn" class="active">單字卡</button><button id="tabQuiz">測驗</button><button id="tabProgress">進度</button></nav><section id="learn" class="panel blue"><div class="center"><small id="position"></small><div class="thai" id="thai"></div><div class="roman" id="roman"></div><p class="muted" id="syllables"></p><button id="speak" class="primary">🔊 聽泰語發音</button><p id="notice" role="status"></p><div id="meaning" class="meaning hidden"></div><button id="flip" class="wide">翻開中文解釋</button></div><div class="actions"><button id="prev">上一張</button><button id="next">下一張</button></div><button id="mark" class="wide">標記為已熟悉</button></section><section id="quiz" class="panel purple hidden"><div id="quizContent"></div></section><section id="progress" class="panel green hidden"><h2>我的學習進度</h2><p id="summary"></p><div id="wordlist"></div><button id="reset" class="wide">清除學習紀錄</button></section><footer>此版本會將學習紀錄儲存在目前瀏覽器的本機儲存空間；清除網站資料或改用其他裝置可能導致紀錄消失。泰語羅馬拼音僅為輔助，尚未完整標示聲調。</footer></main><script>
const words=[{th:'สวัสดี',ro:'sa-wat-dii',zh:'你好',sy:'sa · wat · dii'},{th:'ขอบคุณ',ro:'khop-khun',zh:'謝謝',sy:'khop · khun'},{th:'สบายดีไหม',ro:'sa-baai-dii mai',zh:'你好嗎？',sy:'sa · baai · dii · mai'},{th:'ทำงาน',ro:'tham-ngaan',zh:'工作',sy:'tham · ngaan'},{th:'กินข้าว',ro:'gin-khaao',zh:'吃飯',sy:'gin · khaao'},{th:'วันนี้',ro:'wan-nii',zh:'今天',sy:'wan · nii'}];
const quiz=[{i:3,opts:['閱讀','工作','休息','學習']},{i:1,opts:['對不起','再見','謝謝','沒關係']},{i:5,opts:['明天','昨天','現在','今天']},{i:4,opts:['吃飯','喝水','睡覺','工作']},{i:0,opts:['謝謝','你好','晚安','再見']}];
const $=id=>document.getElementById(id);let index=0,revealed=false,qi=0,selected=null;let data;try{data=JSON.parse(localStorage.getItem('thaiLab11'))||{known:[],answers:{}}}catch{data={known:[],answers:{}}}if(!Array.isArray(data.known)||!data.answers)data={known:[],answers:{}};
function save(){try{localStorage.setItem('thaiLab11',JSON.stringify(data))}catch{}updateCounts()}function updateCounts(){$('knownCount').textContent=data.known.length;$('answeredCount').textContent=Object.keys(data.answers).length}
function showCard(){const w=words[index];$('position').textContent=`單字 ${index+1} / ${words.length}`;$('thai').textContent=w.th;$('roman').textContent=w.ro;$('syllables').textContent='音節：'+w.sy;$('meaning').textContent=w.zh;$('meaning').classList.toggle('hidden',!revealed);$('flip').textContent=revealed?'隱藏中文解釋':'翻開中文解釋';$('mark').textContent=data.known.includes(index)?'✓ 已熟悉（點擊取消）':'標記為已熟悉';$('notice').textContent=''}
function changeTab(name){['learn','quiz','progress'].forEach(t=>{$(t).classList.toggle('hidden',t!==name);$('tab'+t[0].toUpperCase()+t.slice(1)).classList.toggle('active',t===name)});if(name==='progress')showProgress();if(name==='quiz')showQuiz()}
$('tabLearn').onclick=()=>changeTab('learn');$('tabQuiz').onclick=()=>changeTab('quiz');$('tabProgress').onclick=()=>changeTab('progress');$('flip').onclick=()=>{revealed=!revealed;showCard()};$('prev').onclick=()=>{index=(index+words.length-1)%words.length;revealed=false;showCard()};$('next').onclick=()=>{index=(index+1)%words.length;revealed=false;showCard()};$('mark').onclick=()=>{data.known=data.known.includes(index)?data.known.filter(x=>x!==index):[...data.known,index];save();showCard()};
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){$('notice').textContent='這個瀏覽器不支援語音播放。';return}const voices=speechSynthesis.getVoices();const thaiVoice=voices.find(v=>v.lang.toLowerCase().startsWith('th'));if(!thaiVoice){$('notice').textContent='此裝置可能沒有泰語語音，請先檢查 iPad 的語音設定；不會改用其他語言朗讀。';return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(words[index].th);utter.lang='th-TH';utter.voice=thaiVoice;utter.rate=.82;utter.onerror=()=>{$('notice').textContent='播放失敗，請確認音量與語音設定。'};speechSynthesis.speak(utter);$('notice').textContent='正在播放泰語發音…'};
function showQuiz(){const box=$('quizContent');box.replaceChildren();if(qi>=quiz.length){const score=quiz.filter((q,i)=>data.answers[i]===words[q.i].zh).length;box.innerHTML=`<h2>測驗完成</h2><p>得分：${score} / ${quiz.length}</p>`;const b=document.createElement('button');b.textContent='重新測驗';b.className='purplebutton wide';b.onclick=()=>{qi=0;selected=null;data.answers={};save();showQuiz()};box.append(b);return}const q=quiz[qi],w=words[q.i];const h=document.createElement('h2');h.textContent=`第 ${qi+1} 題 / ${quiz.length}`;box.append(h);const p=document.createElement('p');p.className='center thai';p.textContent=w.th;box.append(p);const r=document.createElement('p');r.className='center roman';r.textContent=w.ro;box.append(r);q.opts.forEach(opt=>{const b=document.createElement('button');b.className='option';b.textContent=opt;if(selected!==null){b.disabled=true;if(opt===w.zh)b.classList.add('correct');else if(opt===selected)b.classList.add('wrong')}b.onclick=()=>{if(selected!==null)return;selected=opt;data.answers[qi]=opt;save();showQuiz()};box.append(b)});if(selected!==null){const result=document.createElement('p');result.textContent=selected===w.zh?'答對了！':'正確答案：'+w.zh;box.append(result);const next=document.createElement('button');next.className='purplebutton wide';next.textContent=qi===quiz.length-1?'查看成績':'下一題';next.onclick=()=>{qi++;selected=null;showQuiz()};box.append(next)}}
function showProgress(){$('summary').textContent=`已熟悉 ${data.known.length} / ${words.length} 個單字`;$('wordlist').replaceChildren();words.forEach((w,i)=>{const row=document.createElement('div');row.className='wordrow';const span=document.createElement('span');span.textContent=`${w.th} · ${w.ro} · ${w.zh}`;const status=document.createElement('strong');status.textContent=data.known.includes(i)?'✓':'○';row.append(span,status);$('wordlist').append(row)})}$('reset').onclick=()=>{if(confirm('確定要清除熟悉標記與測驗紀錄嗎？')){data={known:[],answers:{}};qi=0;selected=null;save();showProgress();showCard()}};
updateCounts();showCard();
</script></body></html>
